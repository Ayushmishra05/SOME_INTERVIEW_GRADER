<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test Multiple File Upload</title>
</head>
<body>
  <form id="testForm" method="POST" enctype="multipart/form-data" action="http://localhost:8000/">
    <label for="video_files">Upload Videos (Hold Ctrl/Shift to select multiple):</label>
    <input type="file" id="video_files" name="video_files[]" accept="video/*" multiple>
    <div id="fileList"></div>
    <button type="submit">Submit</button>
  </form>
  <script>
    const fileInput = document.getElementById('video_files');
    const fileList = document.getElementById('fileList');
    fileInput.addEventListener('change', () => {
      fileList.innerHTML = '';
      const files = fileInput.files;
      console.log('Selected files:', Array.from(files).map(f => f.name));
      if (files.length === 0) {
        fileList.innerHTML = 'No files selected';
      } else {
        Array.from(files).forEach(file => {
          const div = document.createElement('div');
          div.textContent = file.name;
          fileList.appendChild(div);
        });
      }
    });
  </script>
</body>
</html>
